<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0033CC" />
  <title>Admin Users - Calmtel</title>
  <link rel="stylesheet" href="/assets/css/cni.css" />
</head>
<body>
  <div id="app-header"></div>
  <div class="adm-wrap">
    <div id="adm-nav"></div>
    <h2 class="adm-title">Users</h2>

    <div class="adm-stats">
      <div class="adm-stat"><b id="cTotal">0</b><span>Total</span></div>
      <div class="adm-stat"><b id="cBanned">0</b><span>Banned</span></div>
      <div class="adm-stat"><b id="cAdmins">0</b><span>Admins</span></div>
    </div>

    <input class="adm-input" id="search" placeholder="Search name, email or code..." oninput="render()" />
    <div id="list"></div>
  </div>
  <div id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/js/supabase.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/components.js"></script>
  <script src="/assets/js/admin-api.js"></script>
  <script>
    const fmt = n => Number(n || 0).toLocaleString() + ' FCFA';
    const esc = value => String(value ?? '').replace(/[&<>\"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '\"':'&quot;', "'":'&#39;' }[c]));
    const jsArg = value => esc(JSON.stringify(String(value ?? '')));
    let SESSION = null, USERS = [];

    async function banUser(uid) {
      const u = USERS.find(x => x.id === uid);
      if (uid === SESSION.user.id) return CniAuth.toast('You cannot ban yourself', 'error');
      if (u?.is_admin) return CniAuth.toast('Remove admin rights first', 'error');
      const reason = prompt('Ban reason (shown to the user):');
      if (reason === null) return;
      if (!reason.trim()) return CniAuth.toast('Reason required', 'error');
      const { error } = await window.sb.from('users').update({ is_banned: true, ban_reason: reason.trim(), banned_at: new Date().toISOString() }).eq('id', uid);
      CniAuth.toast(error ? error.message : '🚫 User banned');
      load();
    }
    async function unbanUser(uid) {
      if (!confirm('Unban this user?')) return;
      await window.sb.from('users').update({ is_banned: false, ban_reason: null, banned_at: null }).eq('id', uid);
      CniAuth.toast('✅ Unbanned');
      load();
    }
    async function adjust(uid) {
      const u = USERS.find(x => x.id === uid);
      const v = prompt('Adjust balance (e.g. +5000 or -2000):');
      if (!v) return;
      const delta = Number(v.replace('+', ''));
      if (!delta || isNaN(delta)) return CniAuth.toast('Invalid amount', 'error');
      const newBal = Number(u.wallet?.balance || 0) + delta;
      if (newBal < 0) return CniAuth.toast('Balance cannot go negative', 'error');
      await window.sb.from('wallets').update({ balance: newBal, updated_at: new Date().toISOString() }).eq('user_id', uid);
      await window.sb.from('wallet_transactions').insert({ user_id: uid, type: 'admin_adjust', amount: delta, description: 'Admin balance adjustment', balance_after: newBal });
      CniAuth.toast('Balance updated');
      load();
    }
    async function toggleAdmin(uid, current) {
      if (!confirm(current ? 'Remove admin rights?' : 'Grant admin rights?')) return;
      await window.sb.from('users').update({ is_admin: !current }).eq('id', uid);
      CniAuth.toast('Admin status updated');
      load();
    }

    function render() {
      const q = (document.getElementById('search').value || '').toLowerCase();
      const items = USERS.filter(u => !q || (u.full_name || '').toLowerCase().includes(q) || (u.email || '').toLowerCase().includes(q) || (u.referral_code || '').toLowerCase().includes(q));
      document.getElementById('list').innerHTML = items.length ? items.map(u => `
        <div class="adm-card" style="${u.is_banned ? 'border-color:rgba(255,77,109,.4);' : ''}">
          <div class="adm-row-top">
            <div>
              <div class="adm-name">${esc(u.full_name || 'Member')} ${u.is_admin ? '👑' : ''} ${u.is_banned ? '🚫' : ''}</div>
              <div class="adm-sub">${esc(u.email || '')}<br>📱 ${esc(u.phone || 'No phone')} • ${esc(u.referral_code || '')} • VIP ${Number(u.vip_level) || 0}<br>Joined ${esc(new Date(u.created_at).toLocaleDateString())}</div>
              ${u.is_banned ? `<div class="adm-sub" style="color:var(--cni-red);font-weight:700;margin-top:4px;">🚫 ${esc(u.ban_reason || 'No reason')}</div>` : ''}
            </div>
            <div style="text-align:right;">
              <div class="adm-amt">${fmt(u.wallet?.balance || 0)}</div>
              <div class="adm-sub">Dep: ${fmt(u.wallet?.total_deposit || 0)}</div>
            </div>
          </div>
          <div class="adm-actions">
            ${u.is_banned
              ? `<button class="adm-btn ok" onclick="unbanUser(${jsArg(u.id)})">✅ Unban</button>`
              : `<button class="adm-btn no" onclick="banUser(${jsArg(u.id)})">🚫 Ban</button>`}
            <button class="adm-btn" onclick="adjust(${jsArg(u.id)})">± Balance</button>
            <button class="adm-btn" onclick="toggleAdmin(${jsArg(u.id)}, ${!!u.is_admin})">${u.is_admin ? 'Remove Admin' : 'Make Admin'}</button>
          </div>
        </div>`).join('') : '<div class="adm-empty">No users found.</div>';
    }

    async function load() {
      try {
        const { users, wallets } = await CniAdminApi.get('users');
        const wm = {}; (wallets || []).forEach(w => { wm[w.user_id] = w; });
        USERS = (users || []).map(u => ({ ...u, wallet: wm[u.id] }));
        document.getElementById('cTotal').textContent = USERS.length;
        document.getElementById('cBanned').textContent = USERS.filter(u => u.is_banned).length;
        document.getElementById('cAdmins').textContent = USERS.filter(u => u.is_admin).length;
        render();
      } catch (error) {
        document.getElementById('list').innerHTML = `<div class="adm-empty" role="alert">Could not load users: ${esc(error.message)}</div>`;
        CniAuth.toast(error.message || 'Could not load users', 'error');
      }
    }

    document.addEventListener('DOMContentLoaded', async function () {
      SESSION = await CniAuth.adminGuard();
      if (!SESSION) return;
      const profile = await CniAuth.getProfile(SESSION.user.id);
      CniUI.header(SESSION, profile);
      CniUI.adminNav('users');
      load();
    });
  </script>
</body>
</html>
