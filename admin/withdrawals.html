<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0033CC" />
  <title>Admin Withdrawals - Calmtel</title>
  <link rel="stylesheet" href="/assets/css/cni.css" />
</head>
<body>
  <div id="app-header"></div>
  <div class="adm-wrap">
    <div id="adm-nav"></div>
    <h2 class="adm-title">Withdrawal Pipeline</h2>

    <div class="adm-stats">
      <div class="adm-stat"><b id="cPending">0</b><span>Pending</span></div>
      <div class="adm-stat"><b id="cDone">0</b><span>Approved</span></div>
      <div class="adm-stat"><b id="cRejected">0</b><span>Rejected</span></div>
    </div>

    <div class="adm-tabs">
      <div class="adm-tab on" data-t="pending">Pending</div>
      <div class="adm-tab" data-t="approved">Approved</div>
      <div class="adm-tab" data-t="rejected">Rejected</div>
    </div>
    <div id="list"></div>
  </div>
  <div id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/js/supabase.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/components.js"></script>
  <script src="/assets/js/admin-api.js"></script>
  <script>
    const fmt = n => '₦' + Number(n || 0).toLocaleString();
    const esc = value => String(value ?? '').replace(/[&<>\"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '\"':'&quot;', "'":'&#39;' }[c]));
    const jsArg = value => esc(JSON.stringify(String(value ?? '')));
    let SESSION = null, TAB = 'pending';

    async function act(id, action) {
      const messages = {
        approve: 'Mark this withdrawal as approved? Confirm that you have processed the payout manually.',
        reject: 'Reject this withdrawal and refund the full amount to the member?'
      };
      if (!messages[action] || !confirm(messages[action])) return;
      try {
        const res = await fetch('/api/withdraw/manage', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + SESSION.access_token },
          body: JSON.stringify({ action, request_id: id })
        });
        const d = await res.json();
        CniAuth.toast(res.ok && d.ok ? (d.message || 'Done') : (d.error || 'Could not process withdrawal'), res.ok && d.ok ? 'success' : 'error');
        if (res.ok && d.ok) load();
      } catch (error) {
        CniAuth.toast(error.message || 'Could not process withdrawal', 'error');
      }
    }

    async function load() {
      const list = document.getElementById('list');
      try {
      const { counts, withdrawals } = await CniAdminApi.get('withdrawals', { status: TAB });
      document.getElementById('cPending').textContent = counts.pending || 0;
      document.getElementById('cDone').textContent = counts.approved || 0;
      document.getElementById('cRejected').textContent = counts.rejected || 0;
      const all = withdrawals || [];
      if (!all.length) { list.innerHTML = '<div class="adm-empty">No ' + TAB + ' withdrawals.</div>'; return; }

      list.innerHTML = all.map(w => `
        <div class="adm-card">
          <div class="adm-row-top">
            <div>
              <div class="adm-name">${esc(w.users?.full_name || 'User')}</div>
              <div class="adm-sub">${esc(w.users?.email || '')}<br>
                💳 ${esc(w.recipient_name || '')}<br>
                Bank: ${esc(w.operator || '—')} • Account: ${esc(w.recipient_mobile || '—')}<br>
                Requested ${esc(CniAuth.timeAgo(w.created_at))}</div>
            </div>
            <div style="text-align:right;">
              <div class="adm-amt red">${fmt(w.amount)}</div>
              <div class="adm-sub">Fee ${fmt(w.fee_amount)} • Pay <b style="color:var(--cni-green)">${fmt(w.net_amount)}</b></div>
              <span class="chip ${['pending', 'sent', 'approved', 'rejected'].includes(w.status) ? (w.status === 'sent' ? 'pending' : w.status) : 'pending'}">${esc(String(w.status === 'sent' ? 'pending' : (w.status || 'unknown')).toUpperCase())}</span>
            </div>
          </div>
          ${w.admin_note ? `<div class="adm-sub" style="margin-top:8px;">📝 ${esc(w.admin_note)}</div>` : ''}
          ${TAB === 'pending' ? `
          <div class="adm-actions">
            <button class="adm-btn ok" onclick="act(${jsArg(w.id)},'approve')">Approve</button>
            <button class="adm-btn no" onclick="act(${jsArg(w.id)},'reject')">Reject</button>
          </div>` : ''}
        </div>`).join('');
      } catch (error) {
        list.innerHTML = `<div class="adm-empty" role="alert">Could not load withdrawals: ${esc(error.message)}</div>`;
        CniAuth.toast(error.message || 'Could not load withdrawals', 'error');
      }
    }

    document.querySelector('.adm-tabs').addEventListener('click', e => {
      const t = e.target.closest('.adm-tab'); if (!t) return;
      document.querySelector('.adm-tab.on').classList.remove('on');
      t.classList.add('on');
      TAB = t.dataset.t; load();
    });

    document.addEventListener('DOMContentLoaded', async function () {
      SESSION = await CniAuth.adminGuard();
      if (!SESSION) return;
      const profile = await CniAuth.getProfile(SESSION.user.id);
      CniUI.header(SESSION, profile);
      CniUI.adminNav('withdrawals');
      load();
    });
  </script>
</body>
</html>
