<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0033CC" />
  <title>Admin Overview - Calmtel</title>
  <link rel="stylesheet" href="/assets/css/cni.css" />
</head>
<body>
  <div id="app-header"></div>
  <div class="adm-wrap">
    <div id="adm-nav"></div>
    <h2 class="adm-title">Network Overview</h2>

    <div class="adm-stats">
      <div class="adm-stat"><b id="sUsers">0</b><span>Users</span></div>
      <div class="adm-stat"><b id="sDep24">0</b><span>Deposits 24h</span></div>
      <div class="adm-stat"><b id="sBanned">0</b><span>Banned</span></div>
    </div>
    <div class="adm-stats">
      <div class="adm-stat"><b id="sPending">0</b><span>WD Pending</span></div>
      <div class="adm-stat"><b id="sSent">0</b><span>At pcmedia</span></div>
      <div class="adm-stat"><b id="sAppToday">0</b><span>Approved Today</span></div>
    </div>

    <div class="adm-title" style="font-size:15px;">Recent Withdrawals</div>
    <div id="recent"></div>
  </div>
  <div id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/js/supabase.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/components.js"></script>
  <script src="/assets/js/admin-api.js"></script>
  <script>
    const fmt = n => Number(n || 0).toLocaleString() + ' FCFA';
    const esc = value => String(value ?? '').replace(/[&<>\"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '\"':'&quot;', "'":'&#39;' }[c]));
    document.addEventListener('DOMContentLoaded', async function () {
      const session = await CniAuth.adminGuard();
      if (!session) return;
      try {
        const profile = await CniAuth.getProfile(session.user.id);
        CniUI.header(session, profile);
        CniUI.adminNav('overview');
        const stats = await CniAdminApi.get('overview');
        document.getElementById('sUsers').textContent = stats.users;
        document.getElementById('sBanned').textContent = stats.banned;
        document.getElementById('sPending').textContent = stats.pending;
        document.getElementById('sSent').textContent = stats.sent;
        document.getElementById('sAppToday').textContent = stats.approvedToday;
        document.getElementById('sDep24').textContent = (stats.deposits24h || []).reduce((sum, tx) => sum + Number(tx.amount || 0), 0).toLocaleString();
        const recent = stats.recent || [];
        document.getElementById('recent').innerHTML = recent.length ? recent.map(w => {
          const status = ['pending', 'sent', 'approved', 'rejected'].includes(w.status) ? w.status : 'pending';
          return `<div class="adm-card"><div class="adm-row-top"><div><div class="adm-name">${esc(w.users?.full_name || 'User')}</div><div class="adm-sub">${esc(CniAuth.timeAgo(w.created_at))} • ${esc(w.recipient_mobile || '')}</div></div><div style="text-align:right;"><div class="adm-amt">${fmt(w.amount)}</div><span class="chip ${status}">${esc(status.toUpperCase())}</span></div></div></div>`;
        }).join('') : '<div class="adm-empty">No withdrawals yet.</div>';
      } catch (error) {
        document.getElementById('recent').innerHTML = `<div class="adm-empty" role="alert">Could not load overview: ${esc(error.message)}</div>`;
        CniAuth.toast(error.message || 'Could not load overview', 'error');
      }
    });
  </script>
</body>
</html>
