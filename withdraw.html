<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0033CC" />
  <title>Withdraw - Calmtel Network International</title>
  <link rel="stylesheet" href="/assets/css/cni.css" />
  <style>
    .wd-lock-overlay { position:absolute; inset:0; z-index:10; background:rgba(2,11,31,.92); backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center; border-radius:inherit; padding:20px; text-align:center; }
    .wd-countdown { font-family:'Montserrat',sans-serif; font-weight:900; font-size:28px; color:var(--cni-cyan); letter-spacing:2px; margin:12px 0; text-shadow:0 0 15px rgba(53,199,255,.5); }
    .form-disabled { opacity:.5; pointer-events:none; filter:grayscale(.8); }
  </style>
</head>
<body>
  <div id="app-header"></div>
  
  <div class="wrap">
    <div id="loadingState" style="text-align:center;padding:40px;color:var(--cni-mut);">💸 Checking withdrawal availability...</div>

    <div id="mainContent" style="display:none;">
      
      <div class="card glow rise d1">
        <div class="row">
          <div class="grow"><div class="lbl">Available Balance</div><div class="amt cyan" id="balAmt">₦0</div></div>
          <span class="chip sent" id="feeChip">8% FEE</span>
        </div>
      </div>

      <div class="card rise d2" style="position:relative;">
        <div id="timeLockOverlay"></div>

        <div class="sec" style="margin-top:0;">Request Withdrawal</div>
        
        <label class="lbl">Amount (NGN ₦)</label>
        <input class="input" id="wAmt" type="number" placeholder="Enter amount" oninput="summary()" />
        
        <div class="card" style="background:rgba(53,199,255,.06);margin-bottom:10px;border:none;box-shadow:none;">
          <div class="row"><div class="grow mut">Charge (<span id="lblFeePct">8</span>%)</div><div class="amt gold" id="wFee" style="font-size:13px;">₦0</div></div>
          <div class="row" style="margin-top:6px;"><div class="grow mut">You receive</div><div class="amt green" id="wNet" style="font-size:15px;">₦0</div></div>
        </div>

        <label class="lbl">Recipient Name</label>
        <input class="input" id="wName" placeholder="Full name on MoMo account" />
        
        <label class="lbl">Recipient MoMo Number</label>
        <input class="input" id="wMobile" type="tel" placeholder="08012345678" autocomplete="off" 
               oninput="this.value=CniAuth.normalizePhone(this.value)" />
        <div class="mut" style="font-size:10px;margin-top:-6px;margin-bottom:10px;">Enter number starting with 0</div>
        
        <label class="lbl">Network Operator</label>
        <select class="input" id="wOperator">
          <option value="mtn">MTN MoMo</option>
          <option value="airtel">Airtel Money</option>
          <option value="glo">Glo Wallet</option>
        </select>
        
        <button class="btn primary" id="wBtn">💸 Request Withdrawal</button>
        <div class="mut" style="margin-top:8px;text-align:center;font-size:11px;">
          Window: <strong>10:00 AM – 5:00 PM WAT</strong> • Unlimited requests<br>
          Minimum: <span id="lblMinWd">5,000</span> NGN
        </div>
      </div>

      <div class="sec rise d3">My Recent Withdrawals</div>
      <div id="wList"></div>
    </div>
  </div>
  
  <div id="app-footer"></div>
  <div id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/js/supabase.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/components.js"></script>
  <script>
    const fmt = n => '₦' + Number(n || 0).toLocaleString();
    let SESSION = null, UID = null, FEE_PCT = 8, MIN_WD = 5000, TIMER_INTERVAL = null;

    // --- WEST AFRICA TIME (GMT+1) CALCULATION ---
    function getWATNow() {
      const now = new Date();
      const utcHours = now.getUTCHours();
      const watHours = (utcHours + 1) % 24;
      return { hours: watHours, minutes: now.getUTCMinutes() };
    }

    function isWithinWindow() {
      const { hours } = getWATNow();
      return hours >= 10 && hours < 17;
    }

    function getNextOpenTime() {
      const { hours } = getWATNow();
      let targetH = 10, dayOffset = 0;
      if (hours >= 17) dayOffset = 1;
      
      const nowDate = new Date();
      const targetDate = new Date(nowDate.getTime() + (dayOffset * 24 * 60 * 60 * 1000));
      targetDate.setUTCHours(targetH - 1, 0, 0, 0);
      return Math.max(0, targetDate.getTime() - nowDate.getTime());
    }

    function formatCountdown(ms) {
      const totalSec = Math.floor(ms / 1000);
      const h = Math.floor(totalSec / 3600);
      const m = Math.floor((totalSec % 3600) / 60);
      const s = totalSec % 60;
      return `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
    }

    function updateLockUI() {
      const overlay = document.getElementById('timeLockOverlay');
      const formCard = overlay.parentElement;
      const btn = document.getElementById('wBtn');
      
      if (isWithinWindow()) {
        if (overlay.innerHTML !== '') overlay.innerHTML = '';
        formCard.classList.remove('form-disabled');
        btn.disabled = false;
        btn.textContent = '💸 Request Withdrawal';
        clearInterval(TIMER_INTERVAL);
      } else {
        const msLeft = getNextOpenTime();
        overlay.innerHTML = `
          <div class="wd-lock-overlay">
            <div style="max-width:320px;">
              <div style="font-size:48px;margin-bottom:10px;">⏳</div>
              <div class="name" style="color:#fff;">Withdrawals Paused</div>
              <div class="mut" style="margin:6px 0;">Next slot opens in:</div>
              <div class="wd-countdown">${formatCountdown(msLeft)}</div>
              <div class="mut" style="font-size:11px;">Operating Hours: 10AM – 5PM WAT</div>
            </div>
          </div>`;
        formCard.classList.add('form-disabled');
        btn.disabled = true;
        btn.textContent = '🔒 Locked Until 10AM';
      }
    }

    function summary() {
      const a = Number(document.getElementById('wAmt').value || 0);
      const f = Math.round(a * FEE_PCT / 100);
      document.getElementById('wFee').textContent = fmt(f);
      document.getElementById('wNet').textContent = fmt(a - f);
    }

    document.addEventListener('DOMContentLoaded', async function () {
      SESSION = await CniAuth.requireAuth();
      if (!SESSION) return;
      UID = SESSION.user.id;

      try {
        const [profileRes, walletRes, settingsRes] = await Promise.all([
          window.sb.from('users').select('*').eq('id', UID).maybeSingle(),
          window.sb.from('wallets').select('*').eq('user_id', UID).maybeSingle(),
          window.sb.from('platform_settings').select('*').eq('id', 1).single()
        ]);

        let profile = profileRes.data;
        let wallet = walletRes.data;

        if (!profile) {
          const code = 'CNI' + Math.random().toString(36).slice(2,7).toUpperCase();
          const meta = SESSION.user.user_metadata || {};
          const { data: np } = await window.sb.from('users').insert({
            id: UID, email: SESSION.user.email, full_name: meta.full_name || 'Member',
            phone: meta.phone || null, referral_code: code, vip_level: 0, is_admin: false, is_banned: false
          }).select().single();
          profile = np;
        }
        if (!wallet) {
          const { data: nw } = await window.sb.from('wallets').insert({ user_id: UID, balance: 0, total_deposit: 0, total_profit: 0, total_referral_earnings: 0 }).select().single();
          wallet = nw;
        }

        const s = settingsRes.data;
        if (s) {
          FEE_PCT = Number(s.withdrawal_fee_percent ?? 8);
          MIN_WD = Number(s.min_withdrawal ?? 5000);
          document.getElementById('lblFeePct').textContent = FEE_PCT;
          document.getElementById('feeChip').textContent = FEE_PCT + '% FEE';
          document.getElementById('lblMinWd').textContent = MIN_WD.toLocaleString();
        }

        CniUI.header(SESSION, profile);
        CniUI.nav();
        document.getElementById('balAmt').textContent = fmt(wallet.balance);

        if (profile?.full_name) document.getElementById('wName').value = profile.full_name;
        if (profile?.phone) {
          let p = CniAuth.normalizePhone(profile.phone);
          if (p) document.getElementById('wMobile').value = p;
        }

        loadHistory();
        document.getElementById('loadingState').style.display = 'none';
        document.getElementById('mainContent').style.display = 'block';
        
        updateLockUI();
        TIMER_INTERVAL = setInterval(updateLockUI, 1000);
        document.getElementById('wBtn').addEventListener('click', handleWithdraw);

      } catch (err) {
        document.getElementById('loadingState').innerHTML = `<div style="color:var(--cni-red);">❌ Error: ${err.message}</div>`;
      }
    });

    async function handleWithdraw() {
      if (!isWithinWindow()) return showToast('Withdrawals open 10AM–5PM WAT only.', 'error');

      const amount = Number(document.getElementById('wAmt').value);
      const localMobile = document.getElementById('wMobile').value;
      const name = document.getElementById('wName').value.trim();
      const operator = document.getElementById('wOperator').value;
      const btn = document.getElementById('wBtn');

      if (!amount || amount < MIN_WD) return showToast(`Minimum withdrawal is ${MIN_WD.toLocaleString()} NGN`, 'error');
      if (name.length < 3) return showToast('Enter recipient full name', 'error');
      if (!localMobile || localMobile.length < 10) return showToast('Enter valid Nigerian phone number', 'error');

      const fullMobile = CniAuth.toInternationalNG(localMobile);
      if (!fullMobile) return showToast('Invalid phone format', 'error');

      btn.disabled = true; btn.textContent = '⏳ Submitting...';

      try {
        const res = await fetch('/api/withdraw/create', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + SESSION.access_token },
          body: JSON.stringify({ amount, recipient_name: name, recipient_mobile: fullMobile, country_code: 'NG', operator })
        });
        const data = await res.json();
        if (!res.ok || !data.ok) throw new Error(data.error || 'Failed');

        showToast('✅ Request queued!', 'success');
        const w2 = await CniAuth.getWallet(UID);
        document.getElementById('balAmt').textContent = fmt(w2?.balance);
        document.getElementById('wAmt').value = ''; summary();
        loadHistory();

      } catch (err) {
        showToast(err.message || 'Error submitting withdrawal.', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = isWithinWindow() ? '💸 Request Withdrawal' : '🔒 Locked';
      }
    }

    async function loadHistory() {
      const container = document.getElementById('wList');
      try {
        const { data: wds } = await window.sb.from('withdrawal_requests').select('*').eq('user_id', UID).order('created_at', { ascending: false }).limit(15);
        if (!wds || wds.length === 0) { container.innerHTML = '<div class="empty">No withdrawals yet.</div>'; return; }

        container.innerHTML = wds.map(w => {
          let dp = w.recipient_mobile || '';
          if (dp.startsWith('234')) dp = '0' + dp.slice(3);
          return `
          <div class="card" style="padding:12px 14px;margin-bottom:8px;">
            <div class="row">
              <div class="grow">
                <div class="name">${fmt(w.amount)}</div>
                <div class="mut">${CniAuth.timeAgo(w.created_at)} • Receive ${fmt(w.net_amount)}<br>To: ${dp} (${w.operator?.toUpperCase()})</div>
              </div>
              <div class="right"><span class="chip ${w.status}">${w.status.toUpperCase()}</span></div>
            </div>
          </div>`;
        }).join('');
      } catch (e) { container.innerHTML = '<div class="empty">Error loading history.</div>'; }
    }

    function showToast(msg, type) { CniAuth.toast(msg, type); }
  </script>
</body>
</html>
