<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0033CC" />
  <title>Withdraw - Calmtel Network International</title>
  <link rel="stylesheet" href="/assets/css/cni.css" />
</head>
<body>
  <div id="app-header"></div>
  
  <div class="wrap">
    <div id="loadingState" style="text-align:center;padding:40px;color:var(--cni-mut);">💸 Checking balance...</div>

    <div id="mainContent" style="display:none;">
      
      <!-- Balance Header -->
      <div class="card glow rise d1">
        <div class="row">
          <div class="grow"><div class="lbl">Available Balance</div><div class="amt cyan" id="balAmt">₦0</div></div>
        </div>
      </div>

      <!-- Withdrawal Form -->
      <div class="card rise d2">
        <div class="sec" style="margin-top:0;">💰 Request Withdrawal</div>
        
        <label class="lbl">Amount (NGN ₦)</label>
        <input class="input" id="wAmt" type="number" placeholder="Enter amount" oninput="summary()" />
        
        <div class="card" style="background:rgba(53,199,255,.06);margin-bottom:10px;border:none;box-shadow:none;">
          <div class="row"><div class="grow mut">Processing Fee (<span id="lblFeePct">8</span>%)</div><div class="amt gold" id="wFee" style="font-size:13px;">₦0</div></div>
          <div class="row" style="margin-top:6px;"><div class="grow mut">You Receive</div><div class="amt green" id="wNet" style="font-size:15px;">₦0</div></div>
        </div>

        <label class="lbl">Recipient Name</label>
        <input class="input" id="wName" placeholder="Full name on bank account" />
        
        <label class="lbl">Bank / Wallet Name</label>
        <select class="input" id="wBank">
          <option value="">Select Bank...</option>
          <option value="GTBank">GTBank</option>
          <option value="Zenith">Zenith Bank</option>
          <option value="Access">Access Bank</option>
          <option value="First Bank">First Bank</option>
          <option value="UBA">UBA</option>
          <option value="Opay">OPay</option>
          <option value="Palmpay">PalmPay</option>
          <option value="Kuda">Kuda Bank</option>
          <option value="Other">Other</option>
        </select>
        
        <label class="lbl">Account Number / Phone</label>
        <input class="input" id="wAcc" placeholder="08012345678 or 0123456789" inputmode="numeric" />
        
        <button class="btn primary" id="wBtn">💸 Submit Withdrawal Request</button>
        <div class="mut" style="margin-top:8px;text-align:center;font-size:11px;">
          Window: <strong>10:00 AM – 5:00 PM WAT</strong><br>
          Minimum: <span id="lblMinWd">5,000</span> NGN
        </div>
      </div>

      <!-- My Withdrawals History -->
      <div class="sec rise d3">My Recent Withdrawals</div>
      <div id="wList"></div>
    </div>
  </div>
  
  <div id="app-footer"></div>
  <div id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/js/supabase.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/components.js"></script>
  <script>
    const fmt = n => '₦' + Number(n || 0).toLocaleString();
    let SESSION = null, UID = null, FEE_PCT = 8, MIN_WD = 5000;

    // --- TIME LOCK LOGIC (Same as before) ---
    function getWATNow() {
      const now = new Date();
      return { hours: (now.getUTCHours() + 1) % 24 };
    }
    function isWithinWindow() { return getWATNow().hours >= 10 && getWATNow().hours < 17; }

    function summary() {
      const a = Number(document.getElementById('wAmt').value || 0);
      const f = Math.round(a * FEE_PCT / 100);
      document.getElementById('wFee').textContent = fmt(f);
      document.getElementById('wNet').textContent = fmt(a - f);
    }

    document.addEventListener('DOMContentLoaded', async function () {
      SESSION = await CniAuth.requireAuth();
      if (!SESSION) return;
      UID = SESSION.user.id;

      try {
        const [profileRes, walletRes, settingsRes] = await Promise.all([
          window.sb.from('users').select('*').eq('id', UID).maybeSingle(),
          window.sb.from('wallets').select('*').eq('user_id', UID).maybeSingle(),
          window.sb.from('platform_settings').select('*').eq('id', 1).single()
        ]);

        let profile = profileRes.data;
        let wallet = walletRes.data;

        // Self-heal logic omitted for brevity (same as previous versions)
        if(!profile){ /* insert logic */ }
        if(!wallet){ /* insert logic */ }

        const s = settingsRes.data;
        if (s) {
          FEE_PCT = Number(s.withdrawal_fee_percent ?? 8);
          MIN_WD = Number(s.min_withdrawal ?? 5000);
          document.getElementById('lblFeePct').textContent = FEE_PCT;
          document.getElementById('lblMinWd').textContent = MIN_WD.toLocaleString();
        }

        CniUI.header(SESSION, profile);
        CniUI.nav();
        document.getElementById('balAmt').textContent = fmt(wallet.balance);

        loadHistory();
        document.getElementById('loadingState').style.display = 'none';
        document.getElementById('mainContent').style.display = 'block';
        
        document.getElementById('wBtn').addEventListener('click', handleWithdraw);

      } catch (err) {
        document.getElementById('loadingState').innerHTML = `<div style="color:red;">❌ Error: ${err.message}</div>`;
      }
    });

    async function handleWithdraw() {
      if (!isWithinWindow()) return showToast('Withdrawals open 10AM–5PM WAT only.', 'error');

      const amount = Number(document.getElementById('wAmt').value);
      const name = document.getElementById('wName').value.trim();
      const bank = document.getElementById('wBank').value;
      const acc = document.getElementById('wAcc').value.replace(/\D/g,'');
      const btn = document.getElementById('wBtn');

      if (!amount || amount < MIN_WD) return showToast(`Minimum withdrawal is ${MIN_WD.toLocaleString()} NGN`, 'error');
      if (name.length < 3) return showToast('Enter recipient full name', 'error');
      if (!bank) return showToast('Select a bank', 'error');
      if (!acc || acc.length < 10) return showToast('Enter valid account number/phone', 'error');

      // Check Balance Client Side (Server will double check)
      const balTxt = document.getElementById('balAmt').textContent.replace(/[^0-9]/g, '');
      if (amount > Number(balTxt)) return showToast('Insufficient balance', 'error');

      btn.disabled = true; btn.textContent = '⏳ Submitting...';

      try {
        const { error } = await window.sb.from('payment_transactions').insert({
          user_id: UID,
          kind: 'withdrawal',
          amount: amount,
          status: 'pending',
          sender_name: name, // Reusing column for Recipient Name
          sender_bank: bank, // Reusing column for Recipient Bank
          reference_number: acc // Reusing column for Acc No
        });

        if (error) throw error;

        showToast('✅ Request submitted! Admin will review shortly.', 'success');
        document.getElementById('wAmt').value = ''; summary();
        loadHistory();

      } catch (err) {
        showToast(err.message || 'Error submitting withdrawal.', 'error');
      } finally {
        btn.disabled = false; btn.textContent = '💸 Submit Withdrawal Request';
      }
    }

    async function loadHistory() {
      const container = document.getElementById('wList');
      const { data: wds } = await window.sb.from('payment_transactions')
        .select('*')
        .eq('user_id', UID)
        .eq('kind', 'withdrawal')
        .order('created_at', { ascending: false })
        .limit(15);

      if (!wds || !wds.length) { container.innerHTML = '<div class="empty">No withdrawals yet.</div>'; return; }

      container.innerHTML = wds.map(w => {
        const cls = w.status === 'approved' ? 'paid' : w.status === 'rejected' ? 'sent' : 'completed';
        return `
        <div class="card" style="padding:12px 14px;margin-bottom:8px;">
          <div class="row">
            <div class="grow">
              <div class="name">${fmt(w.amount)}</div>
              <div class="mut">${w.sender_bank} • To: ${w.reference_number}<br>${CniAuth.timeAgo(w.created_at)}</div>
            </div>
            <div class="right"><span class="chip ${cls}">${w.status.toUpperCase()}</span></div>
          </div>
        </div>`;
      }).join('');
    }

    function showToast(msg, type) { CniAuth.toast(msg, type); }
  </script>
</body>
</html>
