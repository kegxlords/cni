<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0033CC" />
  <title>Withdraw - Calmtel Network International</title>
  <link rel="stylesheet" href="/assets/css/cni.css" />
  <style>
    /* Lock Overlay Styles */
    .wd-lock-overlay {
      position: absolute; inset: 0; z-index: 10;
      background: rgba(2, 11, 31, 0.92); backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center;
      border-radius: inherit; padding: 20px; text-align: center;
    }
    .wd-lock-box { max-width: 320px; }
    .wd-lock-icon { font-size: 48px; margin-bottom: 10px; animation: pulseLock 2s infinite; }
    @keyframes pulseLock { 0%,100%{opacity:.6} 50%{opacity:1} }
    .wd-countdown { 
      font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 28px; 
      color: var(--cni-cyan); letter-spacing: 2px; margin: 12px 0; 
      text-shadow: 0 0 15px rgba(53,199,255,.5);
    }
    .wd-window-info { 
      font-size: 11px; color: var(--cni-mut); line-height: 1.6; 
      background: rgba(255,255,255,.04); padding: 10px; border-radius: 10px; margin-top: 10px;
    }
    .form-disabled { opacity: 0.5; pointer-events: none; filter: grayscale(0.8); }
  </style>
</head>
<body>
  <div id="app-header"></div>
  
  <div class="wrap">
    <!-- Loading State -->
    <div id="loadingState" style="text-align:center;padding:40px;color:var(--cni-mut);">
      💸 Checking withdrawal availability...
    </div>

    <!-- Main Content -->
    <div id="mainContent" style="display:none;">
      
      <!-- Balance Header Card -->
      <div class="card glow rise d1">
        <div class="row">
          <div class="grow"><div class="lbl">Available Balance</div><div class="amt cyan" id="balAmt">0 FCFA</div></div>
          <span class="chip sent" id="feeChip">8% FEE</span>
        </div>
      </div>

      <!-- Withdrawal Form Card (Relative Position for Overlay) -->
      <div class="card rise d2" style="position:relative;">
        
        <!-- 🔒 TIME LOCK OVERLAY (Injected via JS when closed) -->
        <div id="timeLockOverlay"></div>

        <div class="sec" style="margin-top:0;">Request Withdrawal</div>
        
        <label class="lbl">Amount (FCFA)</label>
        <input class="input" id="wAmt" type="number" placeholder="Enter amount" oninput="summary()" />
        
        <!-- Live Fee Summary Box -->
        <div class="card" style="background:rgba(53,199,255,.06);margin-bottom:10px;border:none;box-shadow:none;">
          <div class="row"><div class="grow mut">Charge (<span id="lblFeePct">8</span>%)</div><div class="amt gold" id="wFee" style="font-size:13px;">0 FCFA</div></div>
          <div class="row" style="margin-top:6px;"><div class="grow mut">You receive</div><div class="amt green" id="wNet" style="font-size:15px;">0 FCFA</div></div>
        </div>

        <label class="lbl">Recipient Name</label>
        <input class="input" id="wName" placeholder="Full name on MoMo account" />
        
        <label class="lbl">Recipient MoMo Number</label>
<!-- REMOVED maxlength attribute to prevent iOS space bug -->
<input class="input" id="wMobile" placeholder="6XXXXXXXXX" inputmode="numeric" autocomplete="off" 
       oninput="sanitizePhone(this)" />
<div class="mut" style="font-size:10px;margin-top:-6px;margin-bottom:10px;">Enter number starting with 6 (e.g. 678854784)</div>
        
        <label class="lbl">Network Operator</label>
        <select class="input" id="wOperator">
          <option value="mtn">MTN Mobile Money</option>
          <option value="orange">Orange Money</option>
        </select>
        
        <button class="btn primary" id="wBtn">💸 Request Withdrawal</button>
        <div class="mut" style="margin-top:8px;text-align:center;font-size:11px;">
          Window: <strong>10:00 AM – 5:00 PM WAT</strong> • Unlimited requests<br>
          Minimum: <span id="lblMinWd">1,500</span> FCFA
        </div>
      </div>

      <!-- My Withdrawals History -->
      <div class="sec rise d3">My Recent Withdrawals</div>
      <div id="wList"></div>
    </div>
  </div>
  
  <div id="app-footer"></div>
  <div id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/js/supabase.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/components.js"></script>
  <script>
    const fmt = n => Number(n || 0).toLocaleString() + ' FCFA';
    let SESSION = null;
    let UID = null;
    let FEE_PCT = 8;
    let MIN_WD = 1500;
    let TIMER_INTERVAL = null;

    // Sanitize phone input: remove all non-digits, enforce max 9 chars
function sanitizePhone(el) {
  let val = el.value.replace(/\D/g, ''); // Strip everything except numbers
  
  // Limit to 9 digits strictly
  if (val.length > 9) {
    val = val.slice(0, 9);
  }
  
  // Update value without triggering cursor jump issues where possible
  el.value = val;
                    }
    
    // --- WEST AFRICA TIME (GMT+1) CALCULATION ---
    function getWATNow() {
      // Get current UTC time and add 1 hour to simulate WAT without relying on device timezone
      const now = new Date();
      const utcHours = now.getUTCHours();
      const utcMinutes = now.getUTCMinutes();
      const watHours = (utcHours + 1) % 24;
      return { hours: watHours, minutes: utcMinutes };
    }

    function isWithinWindow() {
      const { hours, minutes } = getWATNow();
      // Open at 10:00, Close strictly before 17:00 (so 16:59 is last valid minute)
      if (hours >= 10 && hours < 17) return true;
      return false;
    }

    function getNextOpenTime() {
      const { hours, minutes } = getWATNow();
      let targetH = 10, targetM = 0, dayOffset = 0;

      if (hours < 10) {
        // Today 10 AM
        targetH = 10; targetM = 0; dayOffset = 0;
      } else if (hours >= 17) {
        // Tomorrow 10 AM
        targetH = 10; targetM = 0; dayOffset = 1;
      }
      
      const nowDate = new Date();
      const targetDate = new Date(nowDate.getTime() + (dayOffset * 24 * 60 * 60 * 1000));
      targetDate.setUTCHours(targetH - 1, targetM, 0, 0); // Subtract 1 because we added 1 earlier for WAT calc
      
      const diffMs = targetDate.getTime() - nowDate.getTime();
      return Math.max(0, diffMs);
    }

    function formatCountdown(ms) {
      const totalSec = Math.floor(ms / 1000);
      const h = Math.floor(totalSec / 3600);
      const m = Math.floor((totalSec % 3600) / 60);
      const s = totalSec % 60;
      return `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
    }

    function updateLockUI() {
      const overlay = document.getElementById('timeLockOverlay');
      const formCard = overlay.parentElement;
      const btn = document.getElementById('wBtn');
      
      if (isWithinWindow()) {
        // OPEN STATE
        if (overlay.innerHTML !== '') overlay.innerHTML = '';
        formCard.classList.remove('form-disabled');
        btn.disabled = false;
        btn.textContent = '💸 Request Withdrawal';
        clearInterval(TIMER_INTERVAL);
      } else {
        // CLOSED STATE
        const msLeft = getNextOpenTime();
        const cdStr = formatCountdown(msLeft);
        
        overlay.innerHTML = `
          <div class="wd-lock-overlay">
            <div class="wd-lock-box">
              <div class="wd-lock-icon">⏳</div>
              <div class="name" style="color:#fff;">Withdrawals Paused</div>
              <div class="mut" style="margin:6px 0;">Next available slot opens in:</div>
              <div class="wd-countdown">${cdStr}</div>
              <div class="wd-window-info">
                Operating Hours:<br><strong>10:00 AM – 5:00 PM WAT</strong><br>(Mon – Sun)<br>
                Please wait or deposit funds meanwhile.
              </div>
            </div>
          </div>`;
          
        formCard.classList.add('form-disabled');
        btn.disabled = true;
        btn.textContent = '🔒 Locked Until 10AM';
      }
    }

    function summary() {
      const a = Number(document.getElementById('wAmt').value || 0);
      const f = Math.round(a * FEE_PCT / 100);
      document.getElementById('wFee').textContent = fmt(f);
      document.getElementById('wNet').textContent = fmt(a - f);
    }

    document.addEventListener('DOMContentLoaded', async function () {
      // 1. GET SESSION
      SESSION = await CniAuth.requireAuth();
      if (!SESSION) return;
      
      UID = SESSION.user.id;
      console.log('[WITHDRAW] Session loaded for:', UID);

      try {
        // 2. FETCH PROFILE & WALLET & SETTINGS IN PARALLEL
        const [profileRes, walletRes, settingsRes] = await Promise.all([
          window.sb.from('users').select('*').eq('id', UID).maybeSingle(),
          window.sb.from('wallets').select('*').eq('user_id', UID).maybeSingle(),
          window.sb.from('platform_settings').select('*').eq('id', 1).single()
        ]);

        // Handle Missing Rows (Self-Heal)
        let profile = profileRes.data;
        let wallet = walletRes.data;

        if (!profile) {
          console.warn('[WITHDRAW] Profile row missing! Creating...');
          const code = 'CNI' + Math.random().toString(36).slice(2,7).toUpperCase();
          const meta = SESSION.user.user_metadata || {};
          
          const { data: newProf, error: profErr } = await window.sb.from('users').insert({
            id: UID, email: SESSION.user.email, full_name: meta.full_name || 'Member',
            phone: meta.phone || null, referral_code: code, vip_level: 0, is_admin: false, is_banned: false
          }).select().single();

          if (profErr) throw new Error('Failed to create profile: ' + profErr.message);
          profile = newProf;
        }

        if (!wallet) {
          console.warn('[WITHDRAW] Wallet row missing! Creating...');
          const { data: newWal, error: walErr } = await window.sb.from('wallets').insert({
            user_id: UID, balance: 0, total_deposit: 0, total_profit: 0, total_referral_earnings: 0
          }).select().single();

          if (walErr) throw new Error('Failed to create wallet: ' + walErr.message);
          wallet = newWal;
        }

        // Extract Settings
        const s = settingsRes.data;
        if (s) {
          FEE_PCT = Number(s.withdrawal_fee_percent ?? 8);
          MIN_WD = Number(s.min_withdrawal ?? 1500);
          document.getElementById('lblFeePct').textContent = FEE_PCT;
          document.getElementById('feeChip').textContent = FEE_PCT + '% FEE';
          document.getElementById('lblMinWd').textContent = MIN_WD.toLocaleString();
        }

        // 3. RENDER HEADER & NAV
        CniUI.header(SESSION, profile);
        CniUI.nav();

        // 4. UPDATE BALANCE DISPLAY
        document.getElementById('balAmt').textContent = fmt(wallet.balance);

        // Prefill recipient info
        if (profile?.full_name) document.getElementById('wName').value = profile.full_name;
        if (profile?.phone) {
          let p = String(profile.phone).replace(/\s/g, '');
          if (p.startsWith('237')) p = p.slice(3);
          if (/^6\d{8}$/.test(p)) document.getElementById('wMobile').value = p;
        }

        // 5. LOAD HISTORY
        loadHistory();

        // Show Content
        document.getElementById('loadingState').style.display = 'none';
        document.getElementById('mainContent').style.display = 'block';

        // 6. INIT TIME CHECKER LOOP
        updateLockUI(); // Initial check
        TIMER_INTERVAL = setInterval(updateLockUI, 1000); // Update every second

        // 7. BIND SUBMIT HANDLER
        document.getElementById('wBtn').addEventListener('click', handleWithdraw);

      } catch (err) {
        console.error('[WITHDRAW] Init Error:', err);
        document.getElementById('loadingState').innerHTML = 
          `<div style="color:var(--cni-red);">❌ Failed to load withdrawal page.<br>${err.message}</div>`;
      }
    });

    async function handleWithdraw() {
      // Double-check time gate client-side just in case race condition occurs
      if (!isWithinWindow()) {
        return showToast('Withdrawals are only open between 10:00 AM and 5:00 PM WAT.', 'error');
      }

      const amtInput = document.getElementById('wAmt');
      const nameInput = document.getElementById('wName');
      const mobileInput = document.getElementById('wMobile');
      const opSelect = document.getElementById('wOperator');
      const btn = document.getElementById('wBtn');

      const amount = Number(amtInput.value);
      const localMobile = mobileInput.value.replace(/\s/g, '');
      const name = nameInput.value.trim();
      const operator = opSelect.value;

      // --- VALIDATION ---
      if (!amount || amount < MIN_WD) {
        return showToast(`Minimum withdrawal is ${MIN_WD.toLocaleString()} FCFA`, 'error');
      }
      if (name.length < 3) {
        return showToast('Please enter recipient full name', 'error');
      }
      if (!/^6\d{8}$/.test(localMobile)) {
        return showToast('Enter a valid Cameroon MoMo number (e.g. 678854784)', 'error');
      }

      const fullMobile = '237' + localMobile;

      btn.disabled = true;
      btn.textContent = '⏳ Submitting...';

      try {
        const res = await fetch('/api/withdraw/create', {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json', 
            'Authorization': 'Bearer ' + SESSION.access_token 
          },
          body: JSON.stringify({ 
            amount: amount, 
            recipient_name: name, 
            recipient_mobile: fullMobile, 
            country_code: 'CM', 
            operator: operator 
          })
        });

        const ct = res.headers.get('content-type') || '';
        if (!ct.includes('application/json')) throw new Error(`Server returned HTTP ${res.status}`);
        
        const data = await res.json();
        
        if (!res.ok || !data.ok) {
          throw new Error(data.error || 'Withdrawal request failed');
        }

        showToast('✅ Request queued for processing!', 'success');
        
        const w2 = await CniAuth.getWallet(UID);
        document.getElementById('balAmt').textContent = fmt(w2?.balance);
        amtInput.value = ''; 
        summary();
        loadHistory();

      } catch (err) {
        console.error('[WITHDRAW] Create Failed:', err);
        showToast(err.message || 'Failed to submit withdrawal.', 'error');
      } finally {
        btn.disabled = false;
        // Restore correct button text based on current time state
        if (isWithinWindow()) btn.textContent = '💸 Request Withdrawal';
        else btn.textContent = '🔒 Locked Until 10AM';
      }
    }

    async function loadHistory() {
      const container = document.getElementById('wList');
      try {
        const { data: wds } = await window.sb.from('withdrawal_requests')
          .select('*')
          .eq('user_id', UID)
          .order('created_at', { ascending: false })
          .limit(15);

        if (!wds || wds.length === 0) {
          container.innerHTML = '<div class="empty">No withdrawals yet.</div>';
          return;
        }

        container.innerHTML = wds.map(w => {
          let displayPhone = w.recipient_mobile || '';
          if (displayPhone.startsWith('237')) displayPhone = displayPhone.slice(3);

          return `
          <div class="card" style="padding:12px 14px;margin-bottom:8px;">
            <div class="row">
              <div class="grow">
                <div class="name">${fmt(w.amount)}</div>
                <div class="mut">${CniAuth.timeAgo(w.created_at)} • Receive ${fmt(w.net_amount)}<br>To: ${displayPhone} (${w.operator?.toUpperCase()})</div>
              </div>
              <div class="right">
                <span class="chip ${w.status}">${w.status.toUpperCase()}</span>
              </div>
            </div>
          </div>`;
        }).join('');

      } catch (e) {
        console.error('[WITHDRAW] History Load Error:', e);
        container.innerHTML = '<div class="empty">Could not load history.</div>';
      }
    }

    function showToast(msg, type) {
      CniAuth.toast(msg, type);
    }
  </script>
</body>
</html>
