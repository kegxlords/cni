<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0033CC" />
  <title>Deposit - Calmtel Network International</title>
  <link rel="stylesheet" href="/assets/css/cni.css" />
</head>
<body>
  <div id="app-header"></div>
  
  <div class="wrap">
    <!-- Loading State -->
    <div id="loadingState" style="text-align:center;padding:40px;color:var(--cni-mut);">
      💳 Loading account details...
    </div>

    <!-- Main Content -->
    <div id="mainContent" style="display:none;">
      
      <!-- Step 1: Transfer Instructions Card -->
      <div class="card glow rise d1">
        <div class="sec" style="margin-top:0;">🏦 Make Bank Transfer</div>
        
        <div class="mut" style="font-size:12px;margin-bottom:10px;">Send funds to any of our active accounts below:</div>
        
        <!-- Dynamic Account List (Injected via JS) -->
        <div id="accountList"></div>
        
        <div class="card" style="background:rgba(255,193,7,.08);border-color:rgba(255,193,7,.3);margin-top:10px;">
          <div class="name" style="color:#FFC107;font-size:13px;">⚠️ Important!</div>
          <ul style="margin:6px 0 0 16px;font-size:11px;color:var(--cni-mut);line-height:1.6;">
            <li>Always include your <strong>Name</strong> in transfer remarks.</li>
            <li>Do NOT send less than minimum amount.</li>
            <li>Upload proof immediately after sending.</li>
          </ul>
        </div>
      </div>

      <!-- Step 2: Submit Proof Form -->
      <div class="card rise d2">
        <div class="sec" style="margin-top:0;">📤 Submit Payment Proof</div>
        
        <label class="lbl">Amount Sent (NGN ₦)</label>
        <input class="input" id="depAmt" type="number" placeholder="Exact amount transferred" />
        
        <label class="lbl">Sender Name</label>
        <input class="input" id="depName" placeholder="Name on the bank account" />
        
        <label class="lbl">Bank / Wallet Used</label>
        <select class="input" id="depBank">
          <option value="">Select Provider...</option>
          <option value="GTBank">GTBank</option>
          <option value="Zenith">Zenith Bank</option>
          <option value="Access">Access Bank</option>
          <option value="First Bank">First Bank</option>
          <option value="UBA">UBA</option>
          <option value="Opay">OPay</option>
          <option value="Palmpay">PalmPay</option>
          <option value="Moniepoint">Moniepoint</option>
          <option value="Other">Other</option>
        </select>
        
        <label class="lbl">Transaction Reference / Teller No.</label>
        <input class="input" id="depRef" placeholder="e.g., TRX123456789" />
        
        <label class="lbl">Upload Receipt Image (Optional)</label>
        <input type="file" id="depFile" accept="image/*" style="width:100%;padding:10px;background:rgba(255,255,255,.05);border-radius:10px;" />
        
        <button class="btn primary" id="depBtn">✅ Confirm Deposit Request</button>
      </div>

      <!-- Recent Requests History -->
      <div class="sec rise d3">My Pending Deposits</div>
      <div id="depHistory"></div>
    </div>
  </div>
  
  <div id="app-footer"></div>
  <div id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/js/supabase.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/components.js"></script>
  <script>
    const fmt = n => '₦' + Number(n || 0).toLocaleString();
    let SESSION = null;
    let ACCOUNTS = []; // Will hold bank details from settings

    document.addEventListener('DOMContentLoaded', async function () {
      SESSION = await CniAuth.requireAuth();
      if (!SESSION) return;
      
      try {
        // Fetch Profile & Settings
        const [profileRes, settingsRes] = await Promise.all([
          window.sb.from('users').select('*').eq('id', SESSION.user.id).single(),
          window.sb.from('platform_settings').select('*').eq('id', 1).single()
        ]);

        CniUI.header(SESSION, profileRes.data);
        CniUI.nav();

        // Parse Accounts JSON from Settings (Assume stored as JSON string or array)
        // If your settings table stores them differently, adjust parsing here.
        // Example structure expected: [{"bank":"GTBank","acc_no":"0123...","name":"Calmtel Ltd"}]
        const s = settingsRes.data;
        if (s.deposit_accounts_json) {
          try { ACCOUNTS = JSON.parse(s.deposit_accounts_json); } catch(e) { console.error("Bad JSON", e); }
        } else {
          // Fallback hardcoded demo data if DB isn't set up yet
          ACCOUNTS = [
            { bank: 'GTBank', acc_no: '0123456789', name: 'CALMTEL NETWORK INTL LTD' },
            { bank: 'OPay', acc_no: '08012345678', name: 'GLOBAL PAYSURE SERVICES' }
          ];
        }

        renderAccounts();
        loadHistory();

        document.getElementById('loadingState').style.display = 'none';
        document.getElementById('mainContent').style.display = 'block';
        
        document.getElementById('depBtn').addEventListener('click', submitDeposit);

      } catch (err) {
        console.error('[DEPOSIT] Init Error:', err);
        document.getElementById('loadingState').innerHTML = `<div style="color:red;">❌ Error: ${err.message}</div>`;
      }
    });

    function renderAccounts() {
      const container = document.getElementById('accountList');
      if (!ACCOUNTS.length) {
        container.innerHTML = '<div class="empty">No active accounts found. Contact support.</div>';
        return;
      }

      container.innerHTML = ACCOUNTS.map((a, i) => `
        <div class="card" style="padding:12px;margin-bottom:8px;background:rgba(53,199,255,.05);">
          <div class="row">
            <div class="grow">
              <div class="name" style="font-size:14px;">${a.bank}</div>
              <div class="mut">${a.name}</div>
              <div style="font-family:monospace;font-weight:900;color:var(--cni-cyan);font-size:16px;margin-top:4px;">
                ${a.acc_no}
              </div>
            </div>
            <button class="btn sm cyan" onclick="copyAcc('${a.acc_no}')">📋 Copy</button>
          </div>
        </div>
      `).join('');
    }

    function copyAcc(num) {
      navigator.clipboard.writeText(num).then(() => CniAuth.toast('Account number copied!'));
    }

    async function submitDeposit() {
      const amt = Number(document.getElementById('depAmt').value);
      const name = document.getElementById('depName').value.trim();
      const bank = document.getElementById('depBank').value;
      const ref = document.getElementById('depRef').value.trim();
      const fileInput = document.getElementById('depFile');

      if (!amt || amt < 500) return CniAuth.toast('Minimum deposit is ₦500', 'error');
      if (!name || !bank || !ref) return CniAuth.toast('Fill all fields correctly', 'error');

      const btn = document.getElementById('depBtn');
      btn.disabled = true; btn.textContent = 'Submitting...';

      try {
        // Optional: Handle File Upload if needed later
        // For now, we just save metadata
        
        const { error } = await window.sb.from('payment_transactions').insert({
          user_id: SESSION.user.id,
          kind: 'deposit',
          amount: amt,
          status: 'pending',
          sender_name: name,
          sender_bank: bank,
          reference_number: ref
          // screenshot_url: ... (future feature)
        });

        if (error) throw error;

        CniAuth.toast('✅ Deposit request submitted! Waiting for admin approval.', 'success');
        
        // Reset form
        document.getElementById('depAmt').value = '';
        document.getElementById('depRef').value = '';
        
        // Refresh history
        loadHistory();

      } catch (err) {
        console.error(err);
        CniAuth.toast('Failed: ' + err.message, 'error');
      } finally {
        btn.disabled = false; btn.textContent = '✅ Confirm Deposit Request';
      }
    }

    async function loadHistory() {
      const container = document.getElementById('depHistory');
      const { data: txs } = await window.sb.from('payment_transactions')
        .select('*')
        .eq('user_id', SESSION.user.id)
        .eq('kind', 'deposit')
        .order('created_at', { ascending: false })
        .limit(10);

      if (!txs || !txs.length) {
        container.innerHTML = '<div class="empty">No deposits yet.</div>';
        return;
      }

      container.innerHTML = txs.map(t => {
        const cls = t.status === 'approved' ? 'paid' : t.status === 'rejected' ? 'sent' : 'completed';
        const label = t.status.toUpperCase();
        return `
        <div class="card" style="padding:12px 14px;margin-bottom:8px;">
          <div class="row">
            <div class="grow">
              <div class="name">${fmt(t.amount)}</div>
              <div class="mut">${t.sender_bank} • Ref: ${t.reference_number}<br>${CniAuth.timeAgo(t.created_at)}</div>
            </div>
            <div class="right"><span class="chip ${cls}">${label}</span></div>
          </div>
        </div>`;
      }).join('');
    }
  </script>
</body>
</html>
