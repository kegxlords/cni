<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0033CC" />
  <title>Deposit - Calmtel Network International</title>
  <link rel="stylesheet" href="/assets/css/cni.css" />
</head>
<body>
  <div id="app-header"></div>
  
  <div class="wrap">
    <!-- Loading State -->
    <div id="loadingState" style="text-align:center;padding:40px;color:var(--cni-mut);">
      🌐 Connecting to gateway...
    </div>

    <!-- Main Content -->
    <div id="mainContent" style="display:none;">
      
      <!-- Deposit Form Card -->
      <div class="card glow rise d1">
        <div class="sec" style="margin-top:0;">💳 Deposit via Mobile Money</div>
        
        <label class="lbl">Amount (NGN ₦)</label>
        <div class="chips">
          <button onclick="setAmt(1000)">1,000</button>
          <button onclick="setAmt(2000)">2,000</button>
          <button onclick="setAmt(5000)">5,000</button>
          <button onclick="setAmt(10000)">10,000</button>
          <button onclick="setAmt(20000)">20,000</button>
        </div>
        <input class="input" id="dAmt" type="number" min="500" placeholder="Min 500 NGN" />
        
        <label class="lbl">Network Operator</label>
        <select class="input" id="dOperator">
          <option value="mtn">MTN MoMo</option>
          <option value="airtel">Airtel Money</option>
          <option value="glo">Glo Wallet</option>
        </select>
        
        <label class="lbl">Your MoMo Number</label>
        <input class="input" id="dPhone" type="tel" placeholder="08012345678" autocomplete="off" 
               oninput="this.value=CniAuth.normalizePhone(this.value)" />
        <div class="mut" style="font-size:10px;margin-top:-6px;margin-bottom:10px;">Enter your number starting with 0</div>
        
        <button class="btn primary" id="dBtn">🚀 Initiate Deposit</button>
        <div class="mut" style="margin-top:8px;text-align:center;font-size:11px;">
          You will be redirected to approve payment on your phone.<br>
          Funds credit automatically upon confirmation.
        </div>
      </div>

      <!-- Recent Deposits List -->
      <div class="sec rise d2">Recent Transactions</div>
      <div id="depList"></div>
    </div>
  </div>
  
  <div id="app-footer"></div>
  <div id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/js/supabase.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/components.js"></script>
  <script>
    const fmt = n => '₦' + Number(n || 0).toLocaleString();
    let SESSION = null;
    const setAmt = v => document.getElementById('dAmt').value = v;

    document.addEventListener('DOMContentLoaded', async function () {
      SESSION = await CniAuth.requireAuth();
      if (!SESSION) return;
      
      const uid = SESSION.user.id;
      console.log('[DEPOSIT] Session loaded for:', uid);

      try {
        const { data: profile } = await window.sb.from('users').select('*').eq('id', uid).single();
        CniUI.header(SESSION, profile);
        CniUI.nav();

        if (profile?.phone) {
          let p = CniAuth.normalizePhone(profile.phone);
          if (p) document.getElementById('dPhone').value = p;
        }

        loadHistory(uid);

        document.getElementById('loadingState').style.display = 'none';
        document.getElementById('mainContent').style.display = 'block';
        document.getElementById('dBtn').addEventListener('click', handleDeposit);

      } catch (err) {
        console.error('[DEPOSIT] Init Error:', err);
        document.getElementById('loadingState').innerHTML = `<div style="color:var(--cni-red);">❌ Failed to initialize deposit page.<br>${err.message}</div>`;
      }
    });

    async function handleDeposit() {
      const amtInput = document.getElementById('dAmt');
      const phoneInput = document.getElementById('dPhone');
      const opSelect = document.getElementById('dOperator');
      const btn = document.getElementById('dBtn');

      const amount = Number(amtInput.value);
      const localMobile = phoneInput.value; // Already normalized by oninput
      const operator = opSelect.value;

      if (!amount || amount < 500) return showToast('Minimum deposit is 500 NGN', 'error');
      if (!localMobile || localMobile.length < 10) return showToast('Enter a valid Nigerian phone number', 'error');

      // Convert to International for Gateway
      const fullMobile = CniAuth.toInternationalNG(localMobile);
      if (!fullMobile) return showToast('Invalid phone format', 'error');

      btn.disabled = true; btn.textContent = '⏳ Opening Gateway...';

      try {
        const res = await fetch('/api/payments/otpay', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + SESSION.access_token },
          body: JSON.stringify({ 
            action: 'deposit-create', 
            amount: amount, 
            operator: operator, 
            mobile: fullMobile,
            country_code: 'NG' // Explicitly send NG
          })
        });

        const ct = res.headers.get('content-type') || '';
        if (!ct.includes('application/json')) throw new Error(`Server returned HTTP ${res.status}`);
        
        const data = await res.json();
        if (!res.ok || !data.ok) throw new Error(data.error || 'Gateway rejected request');

        showToast('✅ Redirecting to secure checkout...', 'success');
        setTimeout(() => { window.location.href = data.h5Url; }, 800);

      } catch (err) {
        console.error('[DEPOSIT] Create Failed:', err);
        showToast(err.message || 'Deposit failed. Please retry.', 'error');
        btn.disabled = false; btn.textContent = '🚀 Initiate Deposit';
      }
    }

    async function loadHistory(uid) {
      const container = document.getElementById('depList');
      try {
        const { data: deps } = await window.sb.from('payment_transactions')
          .select('*').eq('user_id', uid).eq('kind', 'deposit')
          .order('created_at', { ascending: false }).limit(10);

        if (!deps || deps.length === 0) {
          container.innerHTML = '<div class="empty">No deposits yet.</div>';
          return;
        }

        container.innerHTML = deps.map(t => {
          const statusClass = t.status === 'paid' ? 'approved' : t.status === 'pending' ? 'sent' : 'rejected';
          const canCheck = t.status === 'pending';
          
          // Display logic: Normalize back to local for viewing
          let displayPhone = t.phone || '';
          if (displayPhone.startsWith('234')) displayPhone = '0' + displayPhone.slice(3);

          return `
          <div class="card" style="padding:12px 14px;">
            <div class="row">
              <div class="grow">
                <div class="name">${fmt(t.amount)}</div>
                <div class="mut">${CniAuth.timeAgo(t.created_at)} • ${displayPhone} • Ref: ${(t.merchant_order_id || '').slice(-6)}</div>
              </div>
              <div class="right">
                <span class="chip ${statusClass}">${t.status.toUpperCase()}</span>
                ${canCheck ? `<br><button class="btn sm ghost" style="margin-top:6px;" onclick="checkStatus('${t.merchant_order_id}')">🔄 Check Status</button>` : ''}
              </div>
            </div>
          </div>`;
        }).join('');

      } catch (e) {
        console.error('[DEPOSIT] History Load Error:', e);
        container.innerHTML = '<div class="empty">Could not load history.</div>';
      }
    }

    async function checkStatus(orderId) {
      showToast('Checking gateway status...', 'success');
      try {
        const res = await fetch('/api/payments/otpay', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + SESSION.access_token },
          body: JSON.stringify({ action: 'deposit-query', merchantOrderId: orderId })
        });
        const data = await res.json();
        if (data.ok) {
          showToast(`Status updated: ${data.status}`, data.status === 'paid' ? 'success' : 'error');
          loadHistory(SESSION.user.id);
        } else {
          showToast(data.error || 'Query failed', 'error');
        }
      } catch (e) { showToast('Network error checking status', 'error'); }
    }

    function showToast(msg, type) { CniAuth.toast(msg, type); }
  </script>
</body>
</html>
