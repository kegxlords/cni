<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0033CC" />
  <title>Deposit - Calmtel Network International</title>
  <link rel="stylesheet" href="/assets/css/cni.css" />
</head>
<body>
  <div id="app-header"></div>
  <div class="wrap">
    <div class="card glow rise d1">
      <div class="sec" style="margin-top:0;">Deposit via Mobile Money</div>
      <label class="lbl">Amount (FCFA)</label>
      <div class="chips">
        <button onclick="setAmt(2000)">2,000</button>
        <button onclick="setAmt(5000)">5,000</button>
        <button onclick="setAmt(10000)">10,000</button>
        <button onclick="setAmt(20000)">20,000</button>
        <button onclick="setAmt(50000)">50,000</button>
      </div>
      <input class="input" id="dAmt" type="number" min="500" placeholder="Min 500 FCFA" />
      <label class="lbl">Network</label>
      <select class="input" id="dOperator">
        <option value="mtn">MTN Mobile Money</option>
        <option value="orange">Orange Money</option>
      </select>
      <label class="lbl">Your MoMo Number</label>
      <input class="input" id="dPhone" placeholder="2376XXXXXXXX" />
      <button class="btn primary" id="dBtn">💳 Deposit Now</button>
      <div class="mut" style="margin-top:8px;text-align:center;">You'll approve the payment on your phone</div>
    </div>

    <div class="sec rise d2">Recent Deposits</div>
    <div id="depList"></div>
  </div>
  <div id="app-footer"></div>
  <div id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/js/supabase.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/components.js"></script>
  <script>
    const fmt = n => Number(n || 0).toLocaleString() + ' FCFA';
    let SESSION = null;
    const setAmt = v => document.getElementById('dAmt').value = v;

    document.addEventListener('DOMContentLoaded', async function () {
      SESSION = await CniAuth.requireAuth();
      if (!SESSION) return;
      const profile = await CniAuth.getProfile(SESSION.user.id);
      CniUI.header(session = SESSION, profile);
      CniUI.nav();
      if (profile?.phone) document.getElementById('dPhone').value = profile.phone;
      load();

      document.getElementById('dBtn').addEventListener('click', async () => {
        const amt = Number(document.getElementById('dAmt').value);
        const mobile = document.getElementById('dPhone').value.replace(/\s/g, '');
        if (!amt || amt < 500) return CniAuth.toast('Minimum deposit is 500 FCFA', 'error');
        if (!/^237\d{9}$/.test(mobile)) return CniAuth.toast('Enter a valid 237... number', 'error');
        const btn = document.getElementById('dBtn');
        btn.disabled = true; btn.textContent = 'Opening gateway…';
        try {
          const res = await fetch('/api/payments/otpay', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + SESSION.access_token },
            body: JSON.stringify({ action: 'deposit-create', amount: amt, operator: document.getElementById('dOperator').value, mobile, country_code: 'CM' })
          });
          const d = await res.json();
          if (!res.ok || !d.ok) throw new Error(d.error || 'Gateway error');
          location.href = d.h5Url;
        } catch (e) {
          CniAuth.toast(e.message, 'error');
          btn.disabled = false; btn.textContent = '💳 Deposit Now';
        }
      });
    });

    async function load() {
      const { data: deps } = await window.sb.from('payment_transactions')
        .select('*').eq('user_id', SESSION.user.id).eq('kind', 'deposit')
        .order('created_at', { ascending: false }).limit(8);
      document.getElementById('depList').innerHTML = (deps || []).length ? (deps || []).map(t => `
        <div class="card">
          <div class="row">
            <div class="grow">
              <div class="name">${fmt(t.amount)}</div>
              <div class="mut">${CniAuth.timeAgo(t.created_at)} • ${t.merchant_order_id}</div>
            </div>
            <div class="right">
              <span class="chip ${t.status}">${t.status.toUpperCase()}</span>
              ${t.status === 'pending' ? `<button class="btn sm ghost" style="margin-top:6px;" onclick="checkDep('${t.merchant_order_id}')">🔄</button>` : ''}
            </div>
          </div>
        </div>`).join('') : '<div class="empty">No deposits yet.</div>';
    }

    async function checkDep(id) {
      const res = await fetch('/api/payments/otpay', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + SESSION.access_token },
        body: JSON.stringify({ action: 'deposit-query', merchantOrderId: id })
      });
      const d = await res.json();
      CniAuth.toast(d.ok ? 'Status: ' + d.status : d.error, d.ok && d.status === 'paid' ? 'success' : 'error');
      load();
    }
  </script>
</body>
</html>
