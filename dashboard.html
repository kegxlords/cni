<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0033CC" />
  <title>Dashboard - Calmtel Network International</title>
  <link rel="stylesheet" href="/assets/css/cni.css" />
</head>
<body>
  <div id="app-header"></div>
  
  <div class="wrap">
    <!-- Loading State -->
    <div id="loadingState" style="text-align:center;padding:40px;color:var(--cni-mut);">
      🌐 Connecting to network...
    </div>

    <!-- Main Content (Hidden until data ready) -->
    <div id="mainContent" style="display:none;">
      
      <!-- Balance Card -->
      <div class="card glow rise d1 pulse">
        <div class="lbl">Available Balance</div>
        <div class="amt cyan" id="balAmt" style="font-size:30px;">0 FCFA</div>
        <div class="mut" style="margin-top:6px;">Total deposited: <span id="depAmt">0 FCFA</span></div>
      </div>

      <!-- Today's Earning Card -->
      <div class="card rise d2">
        <div class="row">
          <div class="grow">
            <div class="lbl">Today's Earning</div>
            <div class="amt green" id="todayAmt">+0 FCFA</div>
            <div class="mut">Daily potential: <span id="potAmt">0 FCFA</span></div>
          </div>
          <div style="font-size:34px;">⚡</div>
        </div>
      </div>

      <!-- Quick Actions Grid -->
      <div class="qgrid rise d2">
        <a href="/deposit"><span class="ic">💳</span>Deposit</a>
        <a href="/invest"><span class="ic">📈</span>Invest</a>
        <a href="/withdraw"><span class="ic">💸</span>Withdraw</a>
        <a href="/team"><span class="ic">👥</span>Team</a>
      </div>

      <!-- Active Plans Section -->
      <div class="sec rise d3">Active Plans</div>
      <div id="plansContainer"></div>

      <!-- Referral Code Strip -->
      <div class="card rise d3">
        <div class="row">
          <div class="grow">
            <div class="lbl">Your Referral Code</div>
            <div class="name" id="refCodeDisplay" style="color:var(--cni-cyan);font-weight:900;font-size:16px;">—</div>
            <div class="mut">Earn 30% on every downline deposit</div>
          </div>
          <button class="btn sm cyan" onclick="copyRef()">📋 Copy</button>
        </div>
      </div>
    </div>
  </div>
  
  <div id="app-footer"></div>
  <div id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/js/supabase.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/components.js"></script>
  <script>
    const fmt = n => Number(n || 0).toLocaleString() + ' FCFA';
    let UID = null;

    document.addEventListener('DOMContentLoaded', async function () {
      // 1. GET SESSION
      const session = await CniAuth.requireAuth();
      if (!session) return; // Redirects to login if no session
      
      UID = session.user.id;
      console.log('[DASH] Session loaded for:', UID);

      try {
        // 2. FETCH PROFILE & WALLET IN PARALLEL USING .maybeSingle()
        // .maybeSingle() returns { data: null } instead of throwing an error if no row exists
        const [profileRes, walletRes] = await Promise.all([
          window.sb.from('users').select('*').eq('id', UID).maybeSingle(),
          window.sb.from('wallets').select('*').eq('user_id', UID).maybeSingle()
        ]);

        // Handle Missing Rows (Self-Heal)
        let profile = profileRes.data;
        let wallet = walletRes.data;

        if (!profile) {
          console.warn('[DASH] Profile row missing! Creating...');
          const code = 'CNI' + Math.random().toString(36).slice(2,7).toUpperCase();
          const meta = session.user.user_metadata || {};
          
          // Insert new profile
          const { data: newProf, error: profErr } = await window.sb.from('users').insert({
            id: UID, 
            email: session.user.email, 
            full_name: meta.full_name || 'Member',
            phone: meta.phone || null, 
            referral_code: code,
            vip_level: 0,
            is_admin: false,
            is_banned: false
          }).select().single();

          if (profErr) throw new Error('Failed to create profile: ' + profErr.message);
          profile = newProf;
        }

        if (!wallet) {
          console.warn('[DASH] Wallet row missing! Creating...');
          
          // Insert new wallet
          const { data: newWal, error: walErr } = await window.sb.from('wallets').insert({
            user_id: UID, 
            balance: 0, 
            total_deposit: 0, 
            total_profit: 0, 
            total_referral_earnings: 0
          }).select().single();

          if (walErr) throw new Error('Failed to create wallet: ' + walErr.message);
          wallet = newWal;
        }

        // 3. RENDER HEADER & NAV
        CniUI.header(session, profile);
        CniUI.nav();

        // 4. UPDATE BALANCE CARDS
        document.getElementById('balAmt').textContent = fmt(wallet.balance);
        document.getElementById('depAmt').textContent = fmt(wallet.total_deposit);
        document.getElementById('refCodeDisplay').textContent = profile.referral_code || 'N/A';

        // 5. FETCH ACTIVE PLANS
        const { data: plans } = await window.sb.from('user_products')
          .select('*, products(name, amount)')
          .eq('user_id', UID)
          .eq('status', 'active')
          .order('created_at', { ascending: false });

        const activePlans = plans || [];
        
        // Calculate Daily Potential
        const dailyPotential = activePlans.reduce((sum, p) => sum + Number(p.daily_income || 0), 0);
        document.getElementById('potAmt').textContent = fmt(dailyPotential);

        // Render Plans List
        const container = document.getElementById('plansContainer');
        if (activePlans.length === 0) {
          container.innerHTML = `
            <div class="empty">
              No active plans yet.<br>
              Invest to start earning 32.5% daily for 15 days.<br><br>
              <a class="btn sm cyan" href="/invest">📈 Browse Packages</a>
            </div>`;
        } else {
          container.innerHTML = activePlans.map(p => {
            const dayNum = Number(p.days_collected) || 0;
            const progressPct = Math.min(100, (dayNum / 15) * 100);
            return `
            <div class="card">
              <div class="row">
                <div class="grow">
                  <div class="name">${p.products?.name || 'Plan'}</div>
                  <div class="mut">Day ${dayNum}/15 • ${fmt(p.daily_income)}/day</div>
                  <div class="bar" style="margin-top:8px;"><i style="width:${progressPct}%"></i></div>
                </div>
                <div class="right">
                  <div class="amt cyan">${fmt(p.amount)}</div>
                  <span class="chip active">ACTIVE</span>
                </div>
              </div>
            </div>`;
          }).join('');
        }

        // 6. CALCULATE TODAY'S EARNINGS
        const sod = new Date(); 
        sod.setHours(0, 0, 0, 0);
        const { data: todayTx } = await window.sb.from('wallet_transactions')
          .select('amount')
          .eq('user_id', UID)
          .eq('type', 'daily_income')
          .gte('created_at', sod.toISOString());

        const earnedToday = (todayTx || []).reduce((sum, t) => sum + Number(t.amount || 0), 0);
        document.getElementById('todayAmt').textContent = '+' + fmt(earnedToday);

        // Show Content
        document.getElementById('loadingState').style.display = 'none';
        document.getElementById('mainContent').style.display = 'block';

      } catch (err) {
        console.error('[DASH] Critical Error:', err);
        document.getElementById('loadingState').innerHTML = 
          `<div style="color:var(--cni-red);">❌ Failed to load dashboard.<br>${err.message}</div>`;
      }
    });

    function copyRef() {
      const code = document.getElementById('refCodeDisplay').textContent;
      if (code && code !== '—' && code !== 'N/A') {
        CniAuth.copy(code, 'Referral code copied!');
      }
    }
  </script>
</body>
</html>
