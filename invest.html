<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0033CC" />
  <title>Invest - Calmtel Network International</title>
  <link rel="stylesheet" href="/assets/css/cni.css" />
</head>
<body>
  <div id="app-header"></div>
  <div class="wrap">
    <div class="card glow rise d1">
      <div class="row">
        <div class="grow"><div class="lbl">Your Balance</div><div class="amt cyan" id="balAmt">0 FCFA</div></div>
        <a class="btn sm cyan" href="/deposit">+ Deposit</a>
      </div>
    </div>

    <div class="sec rise d2">Network Packages (15 Days)</div>
    <div class="card rise d2" style="padding:10px;">
      <table class="tbl">
        <thead><tr><th>Package</th><th>Daily</th><th>Total</th><th></th></tr></thead>
        <tbody id="pkgTbl"></tbody>
      </table>
    </div>
    <div class="mut" style="text-align:center;margin-bottom:30px;">One active purchase per package • 32.5% daily for 15 days</div>
  </div>
  <div id="app-footer"></div>
  <div id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/js/supabase.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/components.js"></script>
  <script>
    const fmt = n => Number(n || 0).toLocaleString() + ' FCFA';
    let UID = null;
    document.addEventListener('DOMContentLoaded', async function () {
      const session = await CniAuth.requireAuth();
      if (!session) return;
      UID = session.user.id;
      const profile = await CniAuth.getProfile(UID);
      CniUI.header(session, profile);
      CniUI.nav();
      load();
    });

    async function load() {
      const wallet = await CniAuth.getWallet(UID);
      document.getElementById('balAmt').textContent = fmt(wallet?.balance);
      const [{ data: products }, { data: owned }] = await Promise.all([
        window.sb.from('products').select('*').eq('is_active', true).order('amount'),
        window.sb.from('user_products').select('product_id').eq('user_id', UID).eq('status', 'active')
      ]);
      const ownedIds = new Set((owned || []).map(o => o.product_id));
      document.getElementById('pkgTbl').innerHTML = (products || []).map(p => `
        <tr>
          <td class="amt">${Number(p.amount).toLocaleString()}</td>
          <td>${Number(p.daily_income).toLocaleString()}</td>
          <td class="gold">${(Number(p.daily_income) * 15).toLocaleString()}</td>
          <td>${ownedIds.has(p.id)
            ? '<span class="chip active">OWNED</span>'
            : `<button class="btn sm cyan" onclick="buy('${p.id}', '${p.name}', ${p.amount})">BUY</button>`}</td>
        </tr>`).join('');
    }

    async function buy(id, name, amount) {
      if (!confirm(`Purchase ${name} for ${fmt(amount)}?\nYou will earn 32.5% daily for 15 days.`)) return;
      const { data } = await window.sb.rpc('purchase_product', { p_user_id: UID, p_product_id: id });
      if (data?.ok) { CniAuth.toast('🎉 Package activated — earning starts tomorrow'); load(); }
      else CniAuth.toast(data?.error || 'Purchase failed', 'error');
    }
  </script>
</body>
</html>
