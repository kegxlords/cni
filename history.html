<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0033CC" />
  <title>Transaction History - Calmtel Network International</title>
  <link rel="stylesheet" href="/assets/css/cni.css" />
  <style>
    /* Filter Chip Active Style */
    .filter-chip.on { 
      background: var(--cni-cyan); 
      color: #04263B; 
      border-color: transparent; 
      box-shadow: 0 0 14px rgba(53,199,255,.5); 
    }
    .filter-chip {
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid var(--cni-line);
      background: rgba(53,199,255,.08);
      color: var(--cni-cyan);
      font: 800 12px 'Inter';
      cursor: pointer;
      transition: all .2s ease;
    }
  </style>
</head>
<body>
  <div id="app-header"></div>
  
  <div class="wrap">
    <!-- Loading State -->
    <div id="loadingState" style="text-align:center;padding:40px;color:var(--cni-mut);">
      📜 Loading history...
    </div>

    <!-- Main Content -->
    <div id="mainContent" style="display:none;">
      
      <!-- Summary Cards -->
      <div class="stats rise d1">
        <div class="stat"><b class="green" id="sumIn">0</b><span>Total In</span></div>
        <div class="stat"><b class="red" id="sumOut">0</b><span>Total Out</span></div>
        <div class="stat"><b class="cyan" id="countTx">0</b><span>Transactions</span></div>
      </div>

      <!-- Filter Chips -->
      <div class="chips rise d2" id="filters">
        <button class="filter-chip on" data-f="all">All</button>
        <button class="filter-chip" data-f="deposit">Deposits</button>
        <button class="filter-chip" data-f="investment">Investments</button>
        <button class="filter-chip" data-f="income">Daily Income</button>
        <button class="filter-chip" data-f="referral">Referrals</button>
        <button class="filter-chip" data-f="withdrawal">Withdrawals</button>
        <button class="filter-chip" data-f="refund">Refunds</button>
      </div>

      <!-- Transaction List -->
      <div id="txList" class="rise d3"></div>
    </div>
  </div>
  
  <div id="app-footer"></div>
  <div id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/js/supabase.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/components.js"></script>
  <script>
    const fmt = n => Number(n || 0).toLocaleString() + ' FCFA';
    let SESSION = null;
    let UID = null;
    let CURRENT_FILTER = 'all';

    // Map filter keys to actual DB types
    const TYPE_MAP = {
      deposit: ['deposit'],
      investment: ['investment'],
      income: ['daily_income'],
      referral: ['referral_bonus'],
      withdrawal: ['withdrawal'],
      refund: ['withdrawal_refund']
    };

    // Determine chip class based on type
    function getChipClass(type) {
      if (['deposit', 'daily_income', 'referral_bonus', 'withdrawal_refund'].includes(type)) return 'paid';
      if (['investment', 'withdrawal'].includes(type)) return 'sent';
      return 'completed';
    }

    document.addEventListener('DOMContentLoaded', async function () {
      // 1. GET SESSION
      SESSION = await CniAuth.requireAuth();
      if (!SESSION) return;
      
      UID = SESSION.user.id;
      console.log('[HISTORY] Session loaded for:', UID);

      try {
        // 2. FETCH PROFILE FOR HEADER
        const { data: profile } = await window.sb.from('users').select('*').eq('id', UID).single();
        
        // Render Header & Nav immediately
        CniUI.header(SESSION, profile);
        CniUI.nav();

        // 3. LOAD INITIAL DATA (ALL TYPES)
        await loadTransactions('all');

        // Show Content
        document.getElementById('loadingState').style.display = 'none';
        document.getElementById('mainContent').style.display = 'block';

        // 4. BIND FILTER CLICKS
        document.getElementById('filters').addEventListener('click', e => {
          const btn = e.target.closest('.filter-chip');
          if (!btn) return;
          
          // Update active state
          document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('on'));
          btn.classList.add('on');
          
          // Reload with new filter
          CURRENT_FILTER = btn.dataset.f;
          loadTransactions(CURRENT_FILTER);
        });

      } catch (err) {
        console.error('[HISTORY] Init Error:', err);
        document.getElementById('loadingState').innerHTML = 
          `<div style="color:var(--cni-red);">❌ Failed to load history.<br>${err.message}</div>`;
      }
    });

    async function loadTransactions(filterKey) {
      const container = document.getElementById('txList');
      container.innerHTML = '<div class="empty">Loading...</div>';

      try {
        let query = window.sb.from('wallet_transactions')
          .select('*')
          .eq('user_id', UID)
          .order('created_at', { ascending: false })
          .limit(200); // Fetch enough for filtering client-side if needed, but we filter server-side

        if (filterKey !== 'all') {
          const types = TYPE_MAP[filterKey];
          if (types && types.length > 0) {
            query = query.in('type', types);
          }
        }

        const { data: txs, error } = await query;

        if (error) throw error;

        const list = txs || [];
        
        // Calculate Summaries (Only from current filtered view)
        let sumIn = 0, sumOut = 0;
        list.forEach(t => {
          const amt = Number(t.amount);
          if (amt >= 0) sumIn += amt;
          else sumOut += Math.abs(amt);
        });

        document.getElementById('sumIn').textContent = fmt(sumIn).replace(' FCFA','');
        document.getElementById('sumOut').textContent = fmt(sumOut).replace(' FCFA','');
        document.getElementById('countTx').textContent = list.length;

        if (list.length === 0) {
          container.innerHTML = '<div class="empty">No transactions found for this category.</div>';
          return;
        }

        container.innerHTML = list.map(t => {
          const a = Number(t.amount);
          const dateStr = new Date(t.created_at).toLocaleString();
          const chipCls = getChipClass(t.type);
          const typeLabel = t.type.replace('_', ' ').toUpperCase();
          
          return `
          <div class="card" style="padding:12px 14px;margin-bottom:8px;">
            <div class="row">
              <div class="grow">
                <div class="name" style="font-size:13px;font-weight:700;">${t.description || typeLabel}</div>
                <div class="mut" style="font-size:10px;margin-top:2px;">${dateStr} • Bal: ${fmt(t.balance_after)}</div>
              </div>
              <div class="right" style="min-width:80px;">
                <div class="amt ${a >= 0 ? 'green' : 'red'}" style="font-size:14px;font-weight:900;">
                  ${a >= 0 ? '+' : ''}${fmt(a)}
                </div>
                <span class="chip ${chipCls}" style="font-size:9px;margin-top:4px;display:inline-block;">${typeLabel}</span>
              </div>
            </div>
          </div>`;
        }).join('');

      } catch (e) {
        console.error('[HISTORY] Load Error:', e);
        container.innerHTML = `<div class="empty" style="color:var(--cni-red);">Error loading history: ${e.message}</div>`;
      }
    }
  </script>
</body>
</html>
