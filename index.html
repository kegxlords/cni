<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0033CC" />
  <title>Calmtel Network International — Fast • Secure • Reliable</title>
  <link rel="stylesheet" href="/assets/css/cni.css" />
</head>
<body>
  <div id="app-header"></div>
  <div class="wrap">
    <div class="hero rise d1">
      <div class="globe">🌐</div>
      <h1>CALMTEL NETWORK<br>INTERNATIONAL</h1>
      <div class="mut">Your Trusted Network Partner Worldwide</div>
      <div class="tag"><span>FAST</span><span>SECURE</span><span>RELIABLE</span></div>
    </div>

    <div class="card glow rise d2">
      <div class="sec" style="margin-top:0;">Member Login</div>
      <form id="loginForm">
        <label class="lbl">Email</label>
        <input class="input" id="liEmail" type="email" placeholder="you@example.com" required />
        <label class="lbl">Password</label>
        <input class="input" id="liPass" type="password" placeholder="••••••••" required />
        <button class="btn primary" id="liBtn" type="submit">⚡ Login</button>
      </form>
      <a class="btn cyan" style="margin-top:10px;" href="/register">🌐 Create Account</a>
    </div>

    <div class="card rise d3" style="text-align:center;">
      <div class="mut" style="font-size:12px;line-height:1.7;">
        ⚡ 32.5% daily yield for 15 days<br>
        👥 30% referral commission<br>
        💸 Unlimited withdrawals • 8% charge
      </div>
    </div>

    <div style="display:flex;gap:10px;justify-content:center;margin:16px 0 30px;">
      <a class="btn sm ghost" id="tgGroup" href="#">💬 Telegram Group</a>
      <a class="btn sm ghost" id="tgSupport" href="#">🎧 Support</a>
    </div>
  </div>
  <div id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/js/supabase.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/components.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async function () {
      const session = await CniAuth.getSession();
      if (session) { location.href = '/dashboard'; return; }
      CniUI.header(null);

      const { data: s } = await window.sb.from('platform_settings').select('*').eq('id', 1).single();
      if (s?.telegram_group_url) document.getElementById('tgGroup').href = s.telegram_group_url;
      if (s?.telegram_support_url) document.getElementById('tgSupport').href = s.telegram_support_url;

      document.getElementById('loginForm').addEventListener('submit', async e => {
        e.preventDefault();
        const btn = document.getElementById('liBtn');
        btn.disabled = true; btn.textContent = 'Connecting…';
        try {
          await CniAuth.login(document.getElementById('liEmail').value.trim(), document.getElementById('liPass').value);
          location.href = '/dashboard';
        } catch (err) {
          const msg = typeof err === 'string' ? err : (err?.message || 'Login failed');
          CniAuth.toast(msg, 'error');
          btn.disabled = false; btn.textContent = '⚡ Login';
        }
      });
    });
  </script>
</body>
</html>
