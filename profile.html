<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0033CC" />
  <title>Profile - Calmtel Network International</title>
  <link rel="stylesheet" href="/assets/css/cni.css" />
</head>
<body>
  <div id="app-header"></div>
  <div class="wrap">
    <!-- Profile Card -->
    <div class="card glow rise d1" id="pCard">
      <div style="text-align:center;padding:20px;color:var(--cni-mut);">Loading profile…</div>
    </div>

    <!-- Wallet History Preview -->
    <div class="sec rise d2">Wallet History</div>
    <div id="pLedger"></div>
    <a class="btn ghost" style="margin-bottom:14px;" href="/history">📜 View Full Transaction History</a>

    <!-- Support Links -->
    <div class="sec rise d3">Support</div>
    <div style="display:flex;gap:10px;margin-bottom:14px;">
      <a class="btn sm ghost" id="pTg" href="#">💬 Telegram</a>
      <a class="btn sm ghost" id="pWa" href="#"> WhatsApp</a>
    </div>
    <button class="btn danger" onclick="CniAuth.logout()">⏻ Logout</a>
    <div style="height:20px;"></div>
  </div>
  <div id="app-footer"></div>
  <div id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/js/supabase.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/components.js"></script>
  <script>
    const fmt = n => Number(n || 0).toLocaleString() + ' FCFA';

    document.addEventListener('DOMContentLoaded', async function () {
      // 1. Get session (must succeed)
      const session = await CniAuth.requireAuth();
      if (!session) return;
      
      const uid = session.user.id;
      console.log('[PROFILE] Loaded for user:', uid, session.user.email);

      // 2. Render header immediately with email fallback
      let profile = null;
      try {
        // Direct query bypassing any helper functions that might swallow errors
        const { data, error } = await window.sb
          .from('users')
          .select('*')
          .eq('id', uid)
          .single();
          
        if (error) throw error;
        profile = data;
        console.log('[PROFILE] Raw DB response:', profile);
      } catch (e) {
        console.error('[PROFILE] Critical fetch failed:', e);
        // Self-heal attempt: create minimal row if completely missing
        try {
          const code = 'CNI' + Math.random().toString(36).slice(2,7).toUpperCase();
          const meta = session.user.user_metadata || {};
          const { error: insErr } = await window.sb.from('users').insert({
            id: uid,
            email: session.user.email,
            full_name: meta.full_name || 'Member',
            phone: meta.phone || null,
            referral_code: code,
            vip_level: 0,
            is_admin: false,
            is_banned: false
          });
          if (!insErr) {
            await window.sb.from('wallets').insert({ user_id: uid }).catch(() => {});
            const retry = await window.sb.from('users').select('*').eq('id', uid).single();
            if (retry.data) profile = retry.data;
          }
        } catch (healErr) {
          console.error('[PROFILE] Self-heal also failed:', healErr);
        }
      }

      // Final safety net object
      const safeProfile = profile || {
        id: uid,
        email: session.user.email,
        full_name: session.user.user_metadata?.full_name || 'Member',
        phone: session.user.user_metadata?.phone || null,
        referral_code: 'N/A',
        vip_level: 0,
        created_at: new Date().toISOString()
      };

      // 3. Fetch wallet separately (non-blocking)
      let wallet = { balance: 0, total_deposit: 0, total_profit: 0 };
      try {
        const wRes = await window.sb.from('wallets').select('*').eq('user_id', uid).single();
        if (wRes.data) wallet = wRes.data;
      } catch (e) { console.warn('[PROFILE] Wallet fetch warning:', e.message); }

      // 4. RENDER HEADER CARD WITH REAL DATA
      const displayName = (safeProfile.full_name || 'Member').trim();
      const initials = displayName.charAt(0).toUpperCase();
      
      document.getElementById('pCard').innerHTML = `
        <div class="row">
          <div class="av" style="width:52px;height:52px;font-size:20px;">${initials}</div>
          <div class="grow">
            <div class="name" style="font-size:16px;">${displayName}</div>
            <div class="mut">${safeProfile.email || ''}<br>${safeProfile.phone || 'No phone set'}</div>
          </div>
          <span class="chip vip">VIP ${Number(safeProfile.vip_level) || 0}</span>
        </div>
        <div class="stats" style="margin:14px 0 0;">
          <div class="stat"><b class="cyan">${fmt(wallet.balance).replace(' FCFA','')}</b><span>Balance</span></div>
          <div class="stat"><b>${fmt(wallet.total_deposit).replace(' FCFA','')}</b><span>Deposited</span></div>
          <div class="stat"><b class="green">${fmt(wallet.total_profit).replace(' FCFA','')}</b><span>Profit</span></div>
        </div>`;

      // 5. RENDER LEDGER PREVIEW
      try {
        const { data: tx } = await window.sb.from('wallet_transactions')
          .select('*').eq('user_id', uid).order('created_at', { ascending: false }).limit(10);
        
        document.getElementById('pLedger').innerHTML = (tx && tx.length) ? tx.map(t => {
          const a = Number(t.amount);
          return `
          <div class="card" style="padding:12px 14px;">
            <div class="row">
              <div class="grow">
                <div class="name" style="font-size:12.5px;">${t.description || t.type}</div>
                <div class="mut">${CniAuth.timeAgo(t.created_at)}</div>
              </div>
              <div class="right">
                <div class="amt ${a >= 0 ? 'green' : 'red'}" style="font-size:13px;">${a >= 0 ? '+' : ''}${fmt(a)}</div>
                <span class="chip ${t.type === 'deposit' ? 'paid' : t.type === 'withdrawal' ? 'sent' : 'completed'}">${t.type.replace('_',' ').toUpperCase()}</span>
              </div>
            </div>
          </div>`;
        }).join('') : '<div class="empty">No transactions yet.</div>';
      } catch (e) {
        console.error('[PROFILE] Ledger render failed:', e);
        document.getElementById('pLedger').innerHTML = '<div class="empty">Could not load history.</div>';
      }

      // 6. SUPPORT LINKS FROM SETTINGS
      try {
        const { data: s } = await window.sb.from('platform_settings').select('*').eq('id', 1).single();
        if (s?.telegram_support_url) document.getElementById('pTg').href = s.telegram_support_url;
        if (s?.whatsapp_group_url) {
          document.getElementById('pWa').href = s.whatsapp_group_url;
        } else {
          document.getElementById('pWa').style.display = 'none';
        }
      } catch (e) { console.warn('[PROFILE] Settings load warning:', e.message); }

      // 7. FINALIZE NAVIGATION & HEADER
      CniUI.header(session, safeProfile);
      CniUI.nav();
    });
  </script>
</body>
</html>
